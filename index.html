<div id="top" class="glass"><div class="row"><div class="brand"><div class="logo">S</div><div><h1>Sign Scout</h1><small id="rname"></small></div></div>
<div class="row" style="gap:8px"><button class="ib" onclick="openLog()" aria-label="Route log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>

<script>
const KEY='signscout_v1';const $=id=>document.getElementById(id);
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{routes:[],current:null};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function cur(){return db.routes.find(r=>r.id===db.current)}
function startRoute(){const d=new Date();const r={id:Date.now(),name:'Route '+d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),start:Date.now(),status:'active',pins:[]};db.routes.push(r);db.current=r.id;save()}
function setMode(){const a=!!cur();$('startb').style.display=a?'none':'';$('drop').style.display=a?'':'none';$('stopb').style.display=a?'':'none';$('pauseb').style.display=a?'':'none';const pz=a&&isPaused(cur());$('pauseb').classList.toggle('on',pz);$('pauseb').innerHTML=pz?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg><span>Resume</span>':'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg><span>Pause</span>';$('pzb').style.display=pz?'':'none';$('drop').classList.toggle('pz',pz);if(a)$('rname').textContent=cur().name+(pz?' · Paused':' · Active')}
function togglePause(){const c=cur();if(!c)return;c.pauses=c.pauses||[];if(isPaused(c)){c.pauses[c.pauses.length-1].end=Date.now();toast('▶ Route resumed')}else{c.pauses.push({start:Date.now()});toast('⏸ Route paused')}save();setMode();dur();if(navigator.vibrate)navigator.vibrate(30)}
function startFlow(){if(cur())return;startRoute();render();setMode();toast('▶ Route started');if(navigator.vibrate)navigator.vibrate(40)}
async function stopRoute(){const c=cur();if(!c)return;if(!await ask('Stop this route?',hm(AD(c))+' · '+c.pins.length+' sign'+(c.pins.length==1?'':'s')+'. Pins will turn grey and the route is saved to your log.','Stop Route'))return;c.end=Date.now();if(isPaused(c))c.pauses[c.pauses.length-1].end=c.end;c.status='stopped';db.current=null;if(!c.pins.length)db.routes=db.routes.filter(r=>r!==c);save();render();setMode();toast('■ Route stopped · '+hm(AD(c)))}
const RT=r=>{const st=r.start||(r.pins[0]&&r.pins[0].t)||r.id;const en=r.end||(r.id===db.current&&r.status!=='stopped'?null:(r.pins.length?r.pins[r.pins.length-1].t:st));return{st,en}};
function pausedMs(r){return(r.pauses||[]).reduce((n,p)=>n+((p.end||r.end||Date.now())-p.start),0)}
function isPaused(r){const p=r&&r.pauses&&r.pauses[r.pauses.length-1];return!!(p&&!p.end)}
function AD(r){const T=RT(r);return Math.max(0,((T.en||Date.now())-T.st)-pausedMs(r))}
function hm(ms){const m=Math.max(0,Math.floor(ms/60000));return m<60?m+'m':Math.floor(m/60)+'h '+(m%60)+'m'}
(function migrate(){const c=cur();db.routes.forEach(r=>{if(r.id!==db.current&&!r.status)r.status='stopped'});
 if(c){if(c.status==='stopped'){db.current=null}else if(c.pins.length){c.status='active';c.start=c.start||c.pins[0].t||c.id}else{db.routes=db.routes.filter(r=>r!==c);db.current=null}}else db.current=null;save()})();
const map=L.map('map',{zoomControl:false,doubleClickZoom:false}).setView([39.8,-98.6],4);
const darkQ=matchMedia('(prefers-color-scheme: dark)');const ATT='<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>';let base=null;
const NIGHT={background:'#225253',water:'#1f3fa8',waterway:'#1f3fa8',landcover_ice_shelf:'#2a5f5c',landcover_glacier:'#2a5f5c',landuse_residential:'#3a4659',landcover_wood:'#1e4b4c',landuse_park:'#2a5d55',building:'#55687a','aeroway-area':'#3a4659','aeroway-taxiway':'#8a909c','aeroway-runway':'#8a909c','aeroway-runway-casing':'#2a3340',road_area_pier:'#3a4659',road_pier:'#8a909c',highway_path:'#46505f',highway_minor:'#8a909c',highway_major_casing:'#26303c',highway_major_inner:'#9aa0ab',highway_major_subtle:'#8a909c',highway_motorway_casing:'#26303c',highway_motorway_inner:'#a8a7a4',highway_motorway_subtle:'#a39f98',railway_transit:'#4a5568',railway_minor:'#4a5568',railway:'#4f5a6c',railway_transit_dashline:'#3a4659',railway_minor_dashline:'#3a4659',railway_dashline:'#3a4659',boundary_state:'#6b8a8a','boundary_country_z0-4':'#7a9a9a','boundary_country_z5-':'#7a9a9a'};
function night(st){st.layers.forEach(l=>{const p=l.paint=l.paint||{};const c=NIGHT[l.id];
 if(c){if(l.type=='fill'){p['fill-color']=c;if(l.id=='building'){p['fill-outline-color']='#46586a';p['fill-opacity']=.9}}else if(l.type=='line')p['line-color']=c;else if(l.type=='background')p['background-color']=c}
 if(l.type=='symbol'&&l.layout&&l.layout['text-field']){const big=/motorway|city|state|country/.test(l.id);p['text-color']=l.id=='water_name'?'#9fb4ff':big?'#ffffff':'#e4e7ec';p['text-halo-color']='rgba(15,30,35,.9)';if(/highway_name/.test(l.id)){l.layout['text-transform']='uppercase';l.layout['text-letter-spacing']=.08};p['text-halo-width']=1.2}});return st}
function osmFallback(){base=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,className:'dk',attribution:'&copy; OpenStreetMap'}).addTo(map)}
function setBase(){if(base)map.removeLayer(base);
 if(!(window.L&&L.maplibreGL&&window.maplibregl))return osmFallback();
 fetch('https://tiles.openfreemap.org/styles/dark').then(r=>r.json()).then(st=>{base=L.maplibreGL({style:night(st),attribution:ATT}).addTo(map)}).catch(osmFallback)}
setBase();

const layer=L.layerGroup().addTo(map);let me=null,lastPos=null,first=true,viewing=null;
const f6=n=>Number(n).toFixed(6);
function fmt(t){return new Date(t).toLocaleString([],{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'})}
function tm(t){return new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function popup(p,n,rn,rid){const c=f6(p.lat)+', '+f6(p.lng);return '<div class="pp"><b>Sign #'+n+'</b><div class="m">'+rn+'</div><div>'+fmt(p.t)+'</div><div class="c">'+c+'</div><div class="m">Accuracy: '+(p.acc!=null?'±'+Math.round(p.acc)+' m':'n/a')+'</div><div class="acts"><button class="sb" onclick="copyTxt(\''+c+'\')">Copy</button></div>'+mlinks(p,n)+''+(p.flag?'<div class="fl">⚠ Complaint: '+esc(p.flag.note)+(p.flag.contact?'<br><span class="m">'+esc(p.flag.contact)+'</span>':'')+'<br><span class="m">'+fmt(p.flag.t)+'</span></div>':'')+'<div class="acts"><button class="sb'+(p.pickedUp?' pk':'')+'" onclick="togglePick('+rid+','+(n-1)+')">'+(p.pickedUp?'✓ Picked Up':'Mark Picked Up')+'</button><button class="sb fb" onclick="openFlag('+rid+','+(n-1)+')">'+(p.flag?'Edit Complaint':'⚠ Flag Complaint')+'</button><button class="sb rm" onclick="removeSign('+rid+','+(n-1)+')">Remove Sign</button></div></div>'}
function mlinks(p,n){const ll=f6(p.lat)+','+f6(p.lng);const a=(h,t)=>'<a class="ml" target="_blank" rel="noopener" onclick="event.stopPropagation()" href="'+h+'">'+t+'</a>';
 return '<div class="mls">'+a('https://maps.apple.com/?ll='+ll+'&q=Sign%20%23'+n,' Apple Maps')+a('https://maps.apple.com/?daddr='+ll+'&dirflg=d','Apple Directions')+a('https://www.google.com/maps/search/?api=1&query='+ll,'Google Maps')+a('https://www.google.com/maps/dir/?api=1&destination='+ll+'&travelmode=driving','Google Directions')+'</div>'}
function gRoutes(pins){const out=[];const ll=p=>f6(p.lat)+','+f6(p.lng);for(let i=0;i<pins.length;i+=9){const ch=pins.slice(i,i+10);if(ch.length<1)break;
 const o=ch[0],d=ch[ch.length-1],w=ch.slice(1,-1);let u='https://www.google.com/maps/dir/?api=1&origin='+ll(o)+'&destination='+ll(d)+'&travelmode=driving';if(w.length)u+='&waypoints='+encodeURIComponent(w.map(ll).join('|'));out.push({u,a:i+1,b:i+ch.length});if(i+10>=pins.length)break}return out}
function exportKML(){const x=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 let k='<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Sign Scout</name>'+
 '<Style id="cur"><IconStyle><color>ff5ab310</color></IconStyle></Style><Style id="past"><IconStyle><color>ff8a8a8a</color></IconStyle></Style><Style id="flag"><IconStyle><color>ff4444ef</color></IconStyle></Style>';
 db.routes.forEach(r=>{const T=RT(r);k+='<Folder><name>'+x(r.name)+' ('+r.pins.length+' signs)</name><description>'+x('Start: '+new Date(T.st).toLocaleString()+' | End: '+(T.en?new Date(T.en).toLocaleString():'active')+' | Duration: '+hm(AD(r))+(pausedMs(r)?' (paused '+hm(pausedMs(r))+')':''))+'</description><TimeSpan><begin>'+new Date(T.st).toISOString()+'</begin>'+(T.en?'<end>'+new Date(T.en).toISOString()+'</end>':'')+'</TimeSpan>';r.pins.forEach((p,i)=>{k+='<Placemark><name>'+(p.flag?'⚠ ':'')+'Sign #'+(i+1)+(p.pickedUp?' ✓':'')+'</name><styleUrl>#'+(p.flag?'flag':r.id===db.current?'cur':'past')+'</styleUrl><description>'+x(new Date(p.t).toLocaleString()+' | '+f6(p.lat)+', '+f6(p.lng)+(p.acc!=null?' | ±'+Math.round(p.acc)+' m':'')+(p.flag?' | COMPLAINT: '+p.flag.note+(p.flag.contact?' ('+p.flag.contact+')':''):'')+(p.pickedUp?' | PICKED UP: '+new Date(p.pickedUp).toLocaleString():''))+'</description><TimeStamp><when>'+new Date(p.t).toISOString()+'</when></TimeStamp><Point><coordinates>'+f6(p.lng)+','+f6(p.lat)+',0</coordinates></Point></Placemark>'});k+='</Folder>'});
 dl('sign-routes.kml',k+'</Document></kml>','application/vnd.google-earth.kml+xml');toast('KML exported')}
async function removeSign(rid,i){map.closePopup();const r=db.routes.find(x=>x.id===rid);if(!r||!r.pins[i])return;if(!await ask('Remove Sign #'+(i+1)+' from this route?','Remaining signs will be renumbered in drop order.','Remove'))return;const p=r.pins.splice(i,1)[0];save();refresh();if($('sheet').classList.contains('on'))tabI?listFlags():openLog(true);if(navigator.vibrate)navigator.vibrate(40);
 toast('Sign #'+(i+1)+' removed','Undo',()=>{const r2=db.routes.find(x=>x.id===rid);if(!r2)return;r2.pins.splice(Math.min(i,r2.pins.length),0,p);save();refresh();toast('Sign #'+(i+1)+' restored')},5000)}
function togglePick(rid,i){const r=db.routes.find(x=>x.id===rid),p=r.pins[i];if(p.pickedUp)delete p.pickedUp;else p.pickedUp=Date.now();save();map.closePopup();refresh();toast(p.pickedUp?'✓ Sign #'+(i+1)+' picked up':'Sign #'+(i+1)+' unmarked');if(navigator.vibrate)navigator.vibrate(30)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';')}
function pin(p,n,cls,rn,isNew,rid){if(p.flag)cls='r';return L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="pin '+cls+(isNew?' new':'')+'"><i>'+(p.flag?'⚠'+n:n)+'</i>'+(p.pickedUp?'<em class="ck">✓</em>':'')+'</div>',iconSize:[30,30],iconAnchor:[15,34],popupAnchor:[0,-32]}),zIndexOffset:cls=='k'?0:1000}).bindPopup(popup(p,n,rn,rid))}
function copyTxt(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Coordinates copied'),()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Coordinates copied')})}
function render(animLast){layer.clearLayers();const pts=[];
 db.routes.forEach(r=>{if(r.id===db.current)return;r.pins.forEach((p,i)=>{pin(p,i+1,'k',r.name,false,r.id).addTo(layer);pts.push([p.lat,p.lng])})});
 const c=cur();if(c)c.pins.forEach((p,i)=>{pin(p,i+1,'g',c.name,animLast&&i==c.pins.length-1,c.id).addTo(layer);pts.push([p.lat,p.lng])});
 $('rname').textContent=c?c.name+' · Active':'No active route';$('sNow').textContent=c?c.pins.length:0;
 $('sPast').textContent=db.routes.reduce((n,r)=>n+(r.id===db.current?0:r.pins.length),0);dur();return pts}
function dur(){const c=cur();if(c)return $('sDur').textContent=hm(AD(c));const l=db.routes[db.routes.length-1];if(!l)return $('sDur').textContent='0m';const t=RT(l);$('sDur').textContent=hm(AD(l))}
setInterval(dur,30000);
function toast(t,act,fn,ms){const m=$('toast');m.textContent=t;m.classList.toggle('act',!!act);if(act){const b=document.createElement('button');b.textContent=act;b.onclick=()=>{m.classList.remove('on');fn()};m.appendChild(b)}m.classList.add('on');clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('on'),ms||2000);return;m.classList.add('on');clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('on'),2000)}
function ask(t,p,yes){return new Promise(res=>{$('mt').textContent=t;$('mp').textContent=p;$('myes').textContent=yes||'OK';$('myes').classList.toggle('danger',/Remove|Stop/.test(yes||''));$('modal').classList.add('on');
 const done=v=>{$('modal').classList.remove('on');res(v)};$('myes').onclick=()=>done(true);$('mno').onclick=()=>done(false)})}
function ripple(){const r=document.createElement('div');r.className='ring';$('drop').appendChild(r);setTimeout(()=>r.remove(),800)}
function addPin(lat,lng,acc){const c=cur();c.pins.push({lat,lng,acc,t:Date.now()});save();render(true);ripple();const near=allFlags().find(f=>f.p!==c.pins[c.pins.length-1]&&dist(lat,lng,f.p.lat,f.p.lng)<50);toast(near?'⚠ Sign #'+c.pins.length+' dropped near a complaint spot!':'📍 Sign #'+c.pins.length+' dropped');if(navigator.vibrate)navigator.vibrate([40,30,60])}
async function drop(){if(!navigator.geolocation)return toast('No GPS available');
 if(!cur()){if(!await ask('Start a route first?','You need an active route to drop signs.','Start & Drop'))return;startRoute();render();setMode()}
 if(isPaused(cur())){if(!await ask('Resume route?','This route is paused. Resume it and drop the sign?','Resume & Drop'))return;togglePause()}
 if(lastPos&&Date.now()-lastPos.t<5000)return addPin(lastPos.lat,lastPos.lng,lastPos.acc);
 toast('Getting GPS…');navigator.geolocation.getCurrentPosition(p=>addPin(p.coords.latitude,p.coords.longitude,p.coords.accuracy),e=>toast('GPS error: '+e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
async function undo(){const c=cur();if(!c)return toast('No active route');if(!c.pins.length)return toast('Nothing to undo');if(await ask('Undo last sign?','Remove Sign #'+c.pins.length+' from this route.','Remove')){c.pins.pop();save();render();toast('Sign removed')}}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function exportData(){dl('sign-routes.json',JSON.stringify(db,null,2),'application/json');toast('JSON exported')}
function exportCSV(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';let o='route,sign_number,date_time,latitude,longitude,accuracy_m,complaint,complaint_note,complaint_contact,complaint_date,picked_up,picked_up_at,route_start,route_end,route_duration_min,route_paused_min\n';
 db.routes.forEach(r=>{const T=RT(r);r.pins.forEach((p,i)=>{o+=[q(r.name),i+1,q(new Date(p.t).toLocaleString()),f6(p.lat),f6(p.lng),p.acc!=null?Math.round(p.acc*10)/10:'',p.flag?'yes':'no',q(p.flag?p.flag.note:''),q(p.flag?p.flag.contact:''),q(p.flag?new Date(p.flag.t).toLocaleString():''),p.pickedUp?'yes':'no',q(p.pickedUp?new Date(p.pickedUp).toLocaleString():''),q(new Date(T.st).toLocaleString()),q(T.en?new Date(T.en).toLocaleString():'active'),Math.round(AD(r)/60000),Math.round(pausedMs(r)/60000)].join(',')+'\n'})});dl('sign-routes.csv',o,'text/csv');toast('CSV exported')}
let tabI=0;function tab(i){tabI=i;$('tR').classList.toggle('on',!i);$('tC').classList.toggle('on',!!i);i?listFlags():openLog(true)}

function countyData(fips){return incCounty[fips]||(incCounty[fips]=fetch(CR_URL+fips).then(r=>r.json()).then(j=>{if(j.release)incRel=j.release.name+' estimate';const o={};for(const k in j.data){const t=j.data[k].B19013;o[k.slice(7)]={v:t.estimate.B19013001,m:t.error.B19013001}}o._name=(j.geography['05000US'+fips]||{}).name||'';return o}).catch(e=>{delete incCounty[fips];throw e}))}

async function loadIncome(){if(!incOn)return;if(map.getZoom()<11){incStatus('· zoom in');return}incStatus('');const b=map.getBounds(),G=.04;const todo=[];
 for(let x=Math.floor(b.getWest()/G);x<=Math.floor(b.getEast()/G);x++)for(let y=Math.floor(b.getSouth()/G);y<=Math.floor(b.getNorth()/G);y++){const k=x+','+y;if(!incCells.has(k))todo.push([k,x*G,y*G])}

 await Promise.all(todo.map(async([k,x,y])=>{incCells.add(k);try{const q=new URLSearchParams({geometry:[x,y,x+G,y+G].map(n=>n.toFixed(4)).join(','),geometryType:'esriGeometryEnvelope',inSR:4326,spatialRel:'esriSpatialRelIntersects',outFields:'GEOID,STATE,COUNTY,TRACT,NAME',returnGeometry:true,outSR:4326,geometryPrecision:5,maxAllowableOffset:.00008,f:'geojson'});

  fs.forEach(f=>{const p=f.properties;if(incSeen.has(p.GEOID))return;incSeen.add(p.GEOID);const d=data[p.STATE+p.COUNTY],e=d[p.GEOID];p.inc=e&&e.v!=null&&e.v>0?e.v:null;p.moe=e?e.m:null;p.cname=d._name;p.NAME=(p.NAME||'Block Group')+', Tract '+(+p.TRACT/100);incLayer.addData(f)})}catch(e){incCells.delete(k);fail=true}}));

function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(f);f=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=ch}if(f||r.length){r.push(f);rows.push(r)}
 const h=rows.shift().map(x=>x.trim());return rows.filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]])))}
function normItems(arr){return arr.map(o=>({clients:Array.isArray(o.clients)?o.clients:(o.client?String(o.client).split(/\s*;\s*/):[]),address:o.address||'',lat:o.lat===''||o.lat==null?null:+o.lat,lng:o.lng===''||o.lng==null?null:+o.lng,job_count:o.job_count!=null&&o.job_count!==''?+o.job_count:null,job_numbers:o.job_numbers||'',statuses:o.statuses||'',match_quality:o.match_quality||''}))}
function importCustomers(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const t=String(rd.result);let items;
 if(/^\s*[\[{]/.test(t)){const j=JSON.parse(t);items=Array.isArray(j)?j:j.items;if(!Array.isArray(items))throw Error('No items in file')}else items=parseCSV(t);
 items=normItems(items);localStorage.setItem(CKEY,JSON.stringify({imported:Date.now(),items}));const n=items.filter(i=>isFinite(i.lat)&&isFinite(i.lng)&&i.lat!==null).length;
 setCust(true);toast('Imported '+n+' customer pins'+(items.length-n?' ('+(items.length-n)+' without location)':''))}catch(e){toast('Import failed: '+e.message)}inp.value=''};rd.readAsText(f)}
async function clearCustomers(){if(!custData())return toast('No customers imported');if(!await ask('Clear customers?','Removes all imported customer pins from this phone.','Remove'))return;localStorage.removeItem(CKEY);renderCust();toast('Customers cleared')}
function renderCust(){custLayer.clearLayers();const d=custData();let n=0;if(d&&d.items)d.items.forEach(c=>{if(c.lat==null||c.lng==null||!isFinite(c.lat)||!isFinite(c.lng))return;n++;
 const apx=c.match_quality&&c.match_quality!=='exact';const ll=f6(c.lat)+','+f6(c.lng);const a=(h,t)=>'<a class="ml" target="_blank" rel="noopener" href="'+h+'">'+t+'</a>';

function onFix(p){const c=p.coords,ll=[c.latitude,c.longitude],now=Date.now();const cur2={lat:ll[0],lng:ll[1]};
